<div class="d-flex justify-content-center">
  <div class="card" style="width: 26rem">
    <div class="card-body">
      <h5 class="card-title mb-3">Register</h5>
      <form [formGroup]="form" (submit)="onSubmit()">
        <div class="mb-3">
          <label for="firstname" class="form-label">First name</label>
          <input type="text" class="form-control" formControlName="firstname" placeholder="John" />
        </div>
        <div class="mb-3">
          <label for="lastname" class="form-label">Last name</label>
          <input type="text" class="form-control" formControlName="lastname" placeholder="Doe" />
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            formControlName="email"
            placeholder="email@example.com"
          />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input
            type="password"
            class="form-control"
            formControlName="password"
            placeholder="**********"
          />
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Sign up</button>
        <p>* Password must be at least 6 characters lomg</p>
      </form>
    </div>
  </div>
</div>
